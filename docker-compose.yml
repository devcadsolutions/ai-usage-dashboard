services:
  ai-usage:
    build: https://github.com/devcadsolutions/ai-usage-dashboard.git#master
    container_name: ai-usage-dashboard
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      USAGE_APP_PASSWORD: ${USAGE_APP_PASSWORD:?set in Hostinger}
      USAGE_INGEST_TOKEN: ${USAGE_INGEST_TOKEN:?set in Hostinger}
